services:
  postgres:
    image: postgres:16
    container_name: spotify-postgres
    environment:
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: spotify123
      POSTGRES_DB: spotify_db
    ports:
      # Port HOST mengikuti DB_PORT di .env (default 5432). Port container
      # tetap 5432. Kalau 5432 sudah dipakai Postgres lain di komputermu,
      # cukup ubah DB_PORT di .env dan jalankan ulang compose.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: spotify-redis
    ports:
      # Sama seperti postgres: port host mengikuti REDIS_PORT di .env.
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres_data:
